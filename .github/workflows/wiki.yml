# Publishes WIKI.md as the GitHub wiki, one page per section (tools/wiki).
# The wiki must exist first: open the Wiki tab on GitHub and save any first
# page. Every run replaces all pages, so edit WIKI.md, not the wiki.
name: wiki

on:
  push:
    branches: [main]
    paths:
      - WIKI.md
      - tools/wiki/**
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write # the wiki is a git repository; pushing to it needs this

concurrency:
  group: wiki

jobs:
  publish:
    # Only the default branch is published, whatever branch a manual run picks.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Generate pages
        run: go run ./tools/wiki -repo "$GITHUB_REPOSITORY" -branch "$GITHUB_REF_NAME" -out "$RUNNER_TEMP/pages"
      - name: Publish
        env:
          TOKEN: ${{ github.token }}
        run: |
          wiki="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --quiet --depth 1 "$wiki" "$RUNNER_TEMP/wiki"; then
            echo "::error::The wiki does not exist yet. On GitHub, open the Wiki tab, save a first page (any text), then run this workflow again (Actions -> wiki -> Run workflow)."
            exit 1
          fi
          cd "$RUNNER_TEMP/wiki"
          git rm --quiet -r --ignore-unmatch -- '*.md'
          cp "$RUNNER_TEMP"/pages/*.md .
          git add --all
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Update from WIKI.md at ${GITHUB_SHA::7}"
          git push --quiet origin HEAD
          echo "Published $(ls "$RUNNER_TEMP"/pages | wc -l) pages to https://github.com/${GITHUB_REPOSITORY}/wiki"
