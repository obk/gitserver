{{define "content"}}{{with .Data}}<div class="narrow-left">
<h3>Change password</h3>
{{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
{{if .Notice}}<div class="success">{{.Notice}}</div>{{end}}
<form method="post" action="/settings/password" class="form">
<input type="hidden" name="csrf" value="{{$.CSRF}}">
<label for="current">Current password</label>
<input id="current" name="current" type="password" autocomplete="current-password" maxlength="1024" required>
<label for="totp">Authenticator code (or a recovery code)</label>
<input id="totp" name="totp" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="40" placeholder="123456" required>
<label for="password">New password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
<label for="password2">Repeat new password</label>
<input id="password2" name="password2" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
<button type="submit" class="btn">Change password &rarr;</button>
</form>
</div>{{end}}{{end}}
