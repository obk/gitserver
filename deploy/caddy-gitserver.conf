# Drop-in for Caddy: /etc/systemd/system/caddy.service.d/gitserver.conf
#
# Lets Caddy connect to the Anubis and gitserver sockets (group
# gitserver-http, mode 0660). Caddy must be restarted, not just reloaded,
# for a new group to take effect.
#
# /run/caddy holds Caddy's admin API socket (see the Caddyfile written by
# install.sh), so it is not on 127.0.0.1:2019 where any local user could
# reconfigure Caddy.
[Service]
SupplementaryGroups=gitserver-http
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
