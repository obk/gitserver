# fail2ban jail for SSH: /etc/fail2ban/jail.d/gitserver.conf
#
# Bots try passwords on port 22 all day. After 5 failed logins within 10
# minutes, an address is blocked for an hour (all SSH ports install.sh
# found: @PORTS@). git users log in with keys only, so they don't trip it
# unless their key is wrong over and over. Logins are read from the
# systemd journal. FAIL2BAN=0 when running install.sh skips this.
#
# Locked yourself out? Wait an hour, or from the provider's web console:
#   fail2ban-client set sshd unbanip YOUR.IP
[sshd]
enabled   = true
backend   = systemd
port      = @PORTS@
maxretry  = 5
findtime  = 10m
bantime   = 1h
banaction = nftables-multiport
ignoreip  = 127.0.0.1/8 ::1
