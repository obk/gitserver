# git over SSH for gitserver: /etc/ssh/sshd_config.d/50-gitserver.conf
#
# Applies only to the "git" user. Keys are looked up live in gitserver's
# database; every key gets a forced command ("restrict" = no shell, no PTY,
# no forwarding). Logins of all other users are not affected.
Match User git
	AuthorizedKeysFile none
	AuthorizedKeysCommand /usr/local/bin/gitserver ssh-keys -data /var/lib/gitserver %u %t %k
	AuthorizedKeysCommandUser git
	PubkeyAuthentication yes
	AuthenticationMethods publickey
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	PermitTTY no
	PermitUserRC no
	PermitTunnel no
	AcceptEnv GIT_PROTOCOL
