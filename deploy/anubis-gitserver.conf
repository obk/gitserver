# Drop-in for Anubis: /etc/systemd/system/anubis@gitserver.service.d/gitserver.conf
#
# Anubis runs as a dynamic user. With this group, the sockets it creates
# (mode 0660, SOCKET_MODE in gitserver.env) can be opened by Caddy, which
# is in the same group, and Anubis may connect to gitserver's socket.
[Service]
Group=gitserver-http
